<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold My Loot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3B2F2A;
  --muted: #7A6A5C;
  --paper: #FFF9EC;
  --paper2: #F6EBD3;
  --line: #DCCBA6;
  --honey: #F4C35A;
  --honey-d: #D49A2E;
  --leaf: #6E9B5A;
  --berry: #C9574A;
  --page: #E9E0C8;
  --page2: #D8E4CF;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #26302A; --page2: #1D2520; } }
:root[data-theme="dark"] { --page: #26302A; --page2: #1D2520; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 30% 0%, var(--page2), var(--page));
  font-family: Nunito, "Trebuchet MS", system-ui, sans-serif; color: var(--ink);
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; overflow: hidden;
}
#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }

#hud {
  display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 8px;
  margin: 8px 8px 6px; padding: 5px 8px 5px 5px;
  background: var(--paper); border: 1.5px solid var(--line); border-radius: 22px;
  box-shadow: 0 4px 14px rgba(60,45,25,.14);
}
#menuBtn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--paper2); display: grid; place-content: center; gap: 3.5px; cursor: pointer; padding: 0; }
#menuBtn i { display: block; width: 16px; height: 2.2px; border-radius: 2px; background: var(--ink); }
#menuBtn:disabled { opacity: .45; }
.gold { font-weight: 900; font-size: 18px; display: flex; align-items: center; gap: 5px; }
.coin { width: 17px; height: 17px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE9A8, #F2C14E 55%, #C9922E); box-shadow: inset 0 0 0 1px rgba(150,100,30,.5); }
#wave { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 16px; white-space: nowrap; }
.pilewrap { justify-self: end; display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 12px; color: var(--muted); white-space: nowrap; position: relative; }
#pile { display: flex; gap: 2px; }
.pip { width: 6px; height: 11px; border-radius: 3px; background: linear-gradient(#FFE08A, #E9AE3E); box-shadow: inset 0 0 0 1px rgba(150,100,30,.45); display: block; }
.pip.gone { background: transparent; box-shadow: inset 0 0 0 1px rgba(120,100,80,.35); }
#saved { position: absolute; right: 0; top: -15px; font-size: 10.5px; font-weight: 800; color: var(--leaf); opacity: 0; transition: opacity .3s; pointer-events: none; }
#saved.on { opacity: 1; }

#stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
#cv { display: block; touch-action: none; border-radius: 18px; box-shadow: 0 10px 30px rgba(50,40,25,.25), 0 0 0 1.5px rgba(120,95,60,.25); }

#toasts { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(90%, 370px); display: flex; flex-direction: column-reverse; gap: 5px; pointer-events: none; z-index: 3; }
.toast { background: rgba(255,249,236,.96); border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 11px; font-weight: 800; font-size: 13.5px; line-height: 1.25; box-shadow: 0 4px 14px rgba(60,45,25,.18); transition: opacity .35s, transform .35s; }
.toast.big { background: #FFF1C8; border-color: #EAC66A; }
.toast.bad { background: #FBE1DA; border-color: #E7B0A4; }
.toast.rare { background: #EFE3FA; border-color: #CDB4EA; }
.toast.out { opacity: 0; transform: translateY(6px); }
#stage.boss #toasts { bottom: 46px; }

#bossbar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(84%, 320px); z-index: 2; pointer-events: none; }
#bossname { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 13.5px; color: #FFF9EC; text-shadow: 0 1px 3px rgba(40,25,15,.8), 0 0 2px rgba(40,25,15,.8); margin: 0 0 3px 4px; }
.bosstrack { height: 11px; background: rgba(255,249,236,.85); border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1.5px rgba(60,40,30,.5); }
#bossfill { display: block; height: 100%; background: linear-gradient(#F08A72, #C9574A); width: 100%; transition: width .15s; }

#bar { display: grid; grid-template-columns: 1.25fr .8fr .55fr 1.35fr; gap: 6px; margin: 6px 8px 8px; }
.btn {
  font: 800 15px/1.1 Nunito, "Trebuchet MS", system-ui, sans-serif; color: var(--ink);
  background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 8px; min-height: 46px;
  box-shadow: 0 3px 0 var(--line), 0 6px 14px rgba(60,45,25,.10); cursor: pointer; transition: transform .06s, box-shadow .06s;
}
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: linear-gradient(#FFD67A, var(--honey)); border-color: var(--honey-d); box-shadow: 0 3px 0 var(--honey-d), 0 6px 14px rgba(180,120,30,.2); }
.btn.danger { background: #FBE1DA; border-color: #E2A698; box-shadow: 0 3px 0 #E2A698; }
.btn.big { font-size: 17px; min-height: 50px; }
#pokeBtn:not(:disabled) { background: linear-gradient(#FFE5DC, #F8C8BA); border-color: #E2A698; box-shadow: 0 3px 0 #E2A698; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid #6E9BD6; outline-offset: 2px; }

#sheet { position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 4; background: var(--paper); border: 1.5px solid var(--line); border-radius: 20px; box-shadow: 0 10px 28px rgba(60,45,25,.25); padding: 10px; max-height: 72%; overflow: auto; }
#sheet.top { bottom: auto; top: 6px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 18px; }
.x { font: 800 13px Nunito, sans-serif; background: var(--paper2); border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 11px; cursor: pointer; color: var(--ink); }
.cards4 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.tcard { text-align: left; font-family: inherit; color: var(--ink); background: var(--paper2); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 9px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.tcard:disabled { opacity: .45; cursor: default; }
.tcard b { font-size: 15.5px; }
.tcard small { font-size: 12px; color: var(--muted); font-weight: 800; }
.tcard .blurb { font-size: 13px; line-height: 1.2; font-weight: 600; }
.tcard .cost { margin-top: 3px; font-weight: 900; font-size: 14px; color: #8A6420; }
.tinfo { margin: 0 0 9px; font-size: 15px; line-height: 1.35; font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 7px; }
.row2b { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 6px 0; }
.row3 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }

#modal { position: absolute; inset: 0; z-index: 10; background: rgba(45,35,25,.45); display: flex; align-items: center; justify-content: center; padding: 10px; }
#modal[hidden], #sheet[hidden], #bossbar[hidden] { display: none; }
#modalCard { width: 100%; max-width: 430px; max-height: 100%; overflow: auto; background: var(--paper); border: 1.5px solid var(--line); border-radius: 26px; box-shadow: 0 18px 50px rgba(40,30,20,.35); padding: 20px 16px 16px; }
#modalCard.home { background: linear-gradient(180deg, #FFFBF1 0%, var(--paper) 40%); }
.title { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 46px; line-height: .95; margin: 2px 0 6px; color: #3E5E3A; letter-spacing: -.5px; }
.title.sm { font-size: 25px; line-height: 1.1; color: var(--ink); letter-spacing: 0; }
.h2 { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 18px; margin: 16px 0 8px; }
.lede { font-size: 18px; font-weight: 800; margin: 0 0 12px; line-height: 1.25; }
.center { text-align: center; }
.cont { width: 100%; margin-top: 4px; }
.levels { display: grid; gap: 8px; }
.level { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; text-align: left; font-family: inherit; color: var(--ink); background: var(--paper2); border: 1.5px solid var(--line); border-radius: 18px; padding: 9px 11px; cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.level:disabled { opacity: .55; cursor: default; box-shadow: none; }
.lnum { width: 34px; height: 34px; border-radius: 50%; display: grid; place-content: center; background: #E2EFD6; color: #3E5E3A; font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 18px; }
.ltext { display: flex; flex-direction: column; gap: 1px; }
.ltext b { font-size: 16px; }
.ltext span { font-size: 13.5px; line-height: 1.25; font-weight: 600; }
.ltext small { font-size: 12px; color: var(--muted); font-weight: 800; }
.lock { font-size: 12px; font-weight: 800; color: var(--muted); }
.stars { display: inline-flex; gap: 2px; }
.star { width: 15px; height: 15px; display: inline-block; background: #E4D8BE; clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 100%, 50% 77%, 20% 100%, 30% 60%, 0 38%, 38% 35%); }
.star.on { background: linear-gradient(#FFE08A, #EBA93A); }
#modalCard > .stars .star { width: 26px; height: 26px; }
.how { margin-top: 14px; background: var(--paper2); border-radius: 16px; padding: 8px 12px; }
.how summary { font-weight: 900; cursor: pointer; }
.how ul { margin: 8px 0 4px; padding-left: 18px; font-size: 14.5px; line-height: 1.35; font-weight: 600; }
.how li { margin-bottom: 4px; }
.clive { margin: 14px 2px 0; font-size: 14px; font-style: italic; color: var(--muted); font-weight: 700; }
.clive span { display: block; font-style: normal; font-size: 12px; margin-top: 2px; }
.drafts { display: grid; gap: 8px; }
.dcard { text-align: left; font-family: inherit; color: var(--ink); background: var(--paper2); border: 1.5px solid var(--line); border-radius: 16px; padding: 11px 13px; box-shadow: 0 3px 0 var(--line); cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.dcard b { font-size: 17px; }
.dcard span { font-size: 14.5px; line-height: 1.3; font-weight: 600; }
.dcard.cursed { background: #F9E4DE; border-color: #E2A698; box-shadow: 0 3px 0 #E2A698; }
.dcard em { font-style: normal; font-weight: 900; font-size: 12px; color: var(--berry); }
.afk { font-size: 14.5px; line-height: 1.4; margin: 0 0 10px; font-weight: 600; }
.unlockmap { background: #E2EFD6; border-radius: 12px; padding: 7px 10px; font-weight: 900; color: #3E5E3A; margin: 0 0 10px; }
.grid { font-size: 21px; letter-spacing: 2px; margin-bottom: 4px; }
#modalCard h3 { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 16px; margin: 14px 0 6px; }
.haul, .stash { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.haul li, .stash li { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 7px; background: var(--paper2); border-radius: 12px; padding: 5px 9px; font-size: 14.5px; font-weight: 800; }
.stash li { border-left: 4px solid var(--rc); }
.stash li.unk { opacity: .6; }
.stash .nm { display: flex; flex-direction: column; }
.stash .nm i { font-style: normal; color: var(--muted); font-size: 12px; }
.stash small { font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.25; }
.haul .ic, .stash .ic { font-size: 19px; text-align: center; }
.stash li.unk .ic { font-family: Fraunces, Georgia, serif; color: var(--muted); }
.rar { font-weight: 900; font-size: 12.5px; }
.new { font-style: normal; font-size: 11px; background: #FFE08A; border-radius: 6px; padding: 0 5px; margin-left: 4px; }
.small { font-size: 13px; color: var(--muted); font-weight: 700; margin: 6px 0 0; line-height: 1.35; }
.small textarea, #codeBox { width: 100%; font: 13px/1.3 ui-monospace, Menlo, monospace; margin: 6px 0; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px; background: #FFFDF6; color: var(--ink); }
.skill { margin-bottom: 9px; }
.sk-top { display: flex; justify-content: space-between; font-size: 15px; }
.sk-top span { font-weight: 800; color: var(--muted); font-size: 13.5px; }
.skill.up .sk-top span { color: var(--berry); }
.bar { height: 10px; border-radius: 6px; background: #EADFC6; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: linear-gradient(#9CC77A, var(--leaf)); border-radius: 6px; }
.skill.up .bar i { background: linear-gradient(#FFE08A, #EBA93A); }
.sdesc { margin: 3px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.unlock { margin: 3px 0 0; font-size: 14px; font-weight: 900; }
.next { font-size: 15px; font-weight: 900; margin: 8px 0 0; background: #FFF1C8; border-radius: 12px; padding: 7px 10px; }
.menu-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.menu-head .btn { min-height: 40px; padding: 8px 12px; font-size: 14px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--paper2); border-radius: 14px; padding: 4px; margin-bottom: 12px; }
.tab { font: 800 13.5px Nunito, sans-serif; color: var(--muted); background: transparent; border: 0; border-radius: 10px; padding: 8px 4px; cursor: pointer; }
.tab.on { background: var(--paper); color: var(--ink); box-shadow: 0 2px 6px rgba(60,45,25,.12); }
.statlist { list-style: none; margin: 0; padding: 0; }
.statlist li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px solid #EFE3C9; font-size: 14.5px; font-weight: 700; }
.statlist li span { flex: 1; }
.tog { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; background: var(--paper2); border-radius: 14px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
.tog input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--leaf); }
.tog b { display: block; font-size: 15px; }
.tog small { font-size: 13px; color: var(--muted); font-weight: 600; line-height: 1.3; }
.sdetail { background: var(--paper2); border-radius: 14px; padding: 9px 11px; font-size: 14px; font-weight: 700; line-height: 1.35; margin: 8px 0 10px; min-height: 58px; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 7px; }
.stile { position: relative; aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--rc); background: var(--paper2); font-size: 24px; cursor: pointer; display: grid; place-content: center; padding: 0; box-shadow: 0 2px 0 rgba(0,0,0,.06); }
.stile.unk { opacity: .5; border-style: dashed; }
.stile.unk span { font: 800 20px Fraunces, Georgia, serif; color: var(--muted); }
.stile i { position: absolute; right: 3px; bottom: 2px; font: 900 10.5px Nunito, sans-serif; font-style: normal; color: var(--muted); }
.runxp { font-style: normal; font-size: 12px; color: var(--leaf); font-weight: 900; }
.banner { background: linear-gradient(135deg, #FDEBC8, #F8D9A8); border: 1.5px solid #E7C27A; border-radius: 16px; padding: 10px 12px; margin: 0 0 12px; display: flex; flex-direction: column; gap: 2px; }
.banner b { font-family: Fraunces, Georgia, serif; font-size: 17px; }
.banner span { font-size: 14px; font-weight: 700; line-height: 1.3; }
.rockrow { display: flex; align-items: center; gap: 9px; background: var(--paper2); border-radius: 16px; padding: 7px 8px 7px 12px; margin: 12px 0 2px; font-size: 15px; font-weight: 700; }
.rockrow span:nth-child(2) { flex: 1; }
.rockrow b { font-size: 18px; font-weight: 900; }
.rockrow .btn { min-height: 38px; padding: 7px 12px; font-size: 14px; }
.rockrow.res { margin: 0 0 6px; }
.rockrow small { color: var(--muted); font-weight: 700; font-size: 12px; }
.rockic { width: 18px; height: 18px; display: inline-block; vertical-align: -3px; background: linear-gradient(135deg, #D8F1FF, #8EC8F0 45%, #6A8FD8); clip-path: polygon(50% 0, 100% 38%, 80% 100%, 20% 100%, 0 38%); }
.rockic.sm { width: 13px; height: 13px; margin-right: 4px; vertical-align: -2px; }
.lede.sm { font-size: 17px; margin-bottom: 4px; }
.jobs { display: grid; gap: 6px; }
.job { background: var(--paper2); border-radius: 14px; padding: 8px 11px; }
.jt { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 800; line-height: 1.25; }
.jt b { color: #4E7DB8; white-space: nowrap; }
.job small { font-size: 11.5px; color: var(--muted); font-weight: 800; }
.job .bar { height: 7px; margin: 5px 0 2px; }
.bar i { transition: width .4s; }
.jobdone { background: #E2EFD6; border-radius: 12px; padding: 7px 10px; font-weight: 800; margin: 10px 0 0; font-size: 14px; }
.jobdone b { color: #3E5E3A; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mode { text-align: left; font-family: inherit; color: var(--ink); background: linear-gradient(180deg, #EAF3FB, #DCEAF6); border: 1.5px solid #B9CFE4; border-radius: 18px; padding: 10px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; box-shadow: 0 3px 0 #B9CFE4; }
.mode:last-child { background: linear-gradient(180deg, #F1EAFB, #E4D9F5); border-color: #CDBCE8; box-shadow: 0 3px 0 #CDBCE8; }
.mode:disabled { opacity: .5; cursor: default; }
.mode b { font-family: Fraunces, Georgia, serif; font-size: 17px; }
.mode span { font-size: 13px; line-height: 1.25; font-weight: 700; }
.mode small { font-size: 11.5px; color: var(--muted); font-weight: 800; line-height: 1.25; }
.shed { display: grid; gap: 8px; margin-top: 10px; }
.shedrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--paper2); border-radius: 16px; padding: 10px 11px; }
.shedrow b { display: block; font-size: 15.5px; }
.shedrow span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.3; }
.shedrow .btn { min-height: 42px; padding: 8px 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
.pips { display: flex !important; gap: 3px; margin-top: 5px; }
.sp { width: 14px; height: 6px; border-radius: 3px; background: #E4D8BE; display: block; }
.sp.on { background: linear-gradient(#9CC77A, var(--leaf)); }
.tcard.locked { grid-column: span 2; border-style: dashed; }
#modalCard.arming .dcard, #modalCard.arming .row3 .btn { opacity: .55; transform: translateY(6px); }
#modalCard .dcard, #modalCard .row3 .btn { transition: opacity .25s, transform .25s; }
.armbar { height: 4px; border-radius: 2px; background: #EFE3C9; overflow: hidden; margin: -4px 0 10px; }
.armbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #9CC77A, var(--leaf)); transform-origin: left; }
#modalCard.arming .armbar i { animation: arm var(--arm, 850ms) linear forwards; }
@keyframes arm { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { #modalCard .dcard, #modalCard .row3 .btn { transition: none; } #modalCard.arming .armbar i { animation: none; } }
#startBtn.early { background: linear-gradient(#FFE6B0, #F7C774); font-size: 13.5px; }
.slider { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; background: var(--paper2); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; font-weight: 800; font-size: 15px; }
.slider input { width: 100%; accent-color: var(--leaf); }
.ultbtn { background: linear-gradient(90deg, #FF8A8A, #FFC46B, #FFE97A, #8EE08A, #7CC8FF, #B59BFF, #FF9BE0); border-color: #C98A3A; box-shadow: 0 3px 0 #C98A3A; font-weight: 900; color: #3B2F2A; text-shadow: 0 1px 0 rgba(255,255,255,.7); }
.ultdone { background: linear-gradient(90deg, #FFE6E6, #FFF3D6, #E6F7E2, #E2F1FF, #F1E8FF); }
.ultdesc { margin: -4px 0 9px; font-size: 13.5px; font-weight: 700; line-height: 1.3; background: linear-gradient(90deg, rgba(255,138,138,.15), rgba(124,200,255,.15), rgba(181,155,255,.15)); border-radius: 12px; padding: 7px 9px; }
.menu-foot { margin-top: 14px; padding-top: 10px; border-top: 1px solid #EFE3C9; }
.menu-foot .btn { width: 100%; }
@media (prefers-reduced-motion: reduce) { .toast, #bossfill, .btn, #saved { transition: none; } }
@media (max-height: 660px) { #hud { margin-top: 4px; } #bar { margin-bottom: 4px; } .btn { min-height: 42px; padding: 7px 6px; } .title { font-size: 38px; } }
</style>
</head>
<body>
<div id="app">

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mkPath(pts) {
  const segs = []; let len = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const l = Math.hypot(x2 - x1, y2 - y1);
    segs.push({ x1, y1, x2, y2, len: l, start: len }); len += l;
  }
  return { pts, segs, len };
}
function posOn(P, d) {
  const s0 = P.segs[0];
  if (d <= 0) { const ux = (s0.x2 - s0.x1) / s0.len, uy = (s0.y2 - s0.y1) / s0.len; return { x: s0.x1 + ux * d, y: s0.y1 + uy * d, dx: Math.sign(ux), dy: Math.sign(uy) }; }
  for (const s of P.segs) {
    if (d <= s.start + s.len) {
      const t = (d - s.start) / s.len;
      return { x: s.x1 + (s.x2 - s.x1) * t, y: s.y1 + (s.y2 - s.y1) * t, dx: Math.sign(Math.round(s.x2 - s.x1)), dy: Math.sign(Math.round(s.y2 - s.y1)) };
    }
  }
  const s = P.segs[P.segs.length - 1];
  return { x: s.x2, y: s.y2, dx: 0, dy: 1 };
}

function kill(G, e, src) {

  const i = G.enemies.indexOf(e); if (i >= 0) G.enemies.splice(i, 1);

  fx(G, 'death', { x: e.x, y: e.y, r: e.r, type: e.type, gold: g });
  if (src) {

    G.xp[src] += xp;
    fx(G, 'pop', { x: e.x, y: e.y - 12, text: '+' + xp + ' ' + SKILL_NAMES[src], col: '#3B2F2A' });
  }
  if (e.grab) { const l = G.loot.find(l => l.id === e.grab.lid); if (l) l.claimed = 0; e.grab = null; }
  if (e.carry) { dropLoot(G, e, e.carry); G.gold += 10; }

    const first = !G.meta.totals.bosses[e.type];
    if (first || G.rng() < .3) dropLoot(G, e, Object.assign({}, BOSS_ITEMS[e.type]));
    dropLoot(G, Object.assign({}, e, { d: e.d - 20 }), rollItem(G));
    dropLoot(G, Object.assign({}, e, { d: e.d - 40 }), rollItem(G));

}

function checkLose(G) {
  if (G.pile <= 0 && !G.over) { G.pile = 0; G.over = true; G.won = false; G.waveActive = false; ev(G, 'over', { won: false }); }
}

function update(G, dt) {
  if (G.over) return;
  G.t += dt;
  if (G.kevinCd > 0) G.kevinCd -= dt;
  const map = G.map;
  if (G.waveActive) {
    G.waveT += dt;
    while (G.spawnQ.length && G.spawnQ[0].at <= G.waveT) { const s = G.spawnQ.shift(); spawn(G, s.type, null, choosePath(G, s.p)); }
  }
  const sizzles = [];
  G.towers.forEach((t, i) => {
    if (t && t.type === 'sizzle' && t.hatless <= 0) {
      const tr = TOWERS.sizzle.tiers[t.tier];
      sizzles.push({ i, x: map.pads[i][0], y: map.pads[i][1], r: tr.aura * G.mods.sizzleRange, buff: tr.buff * G.skillMult.sizzling, slow: tr.slow, tier: t.tier });
    }

  if (sizzles.length > 1) globalBuff += .04 * (sizzles.length - 1);

  G.lvlT -= dt;

  }

        fx(G, 'chug', { x: e.x, y: e.y }); fx(G, 'pop', { x: e.x, y: e.y - 44, text: 'Chrisso finished your drink. +' + heal, col: '#B8742A', big: true });
        if (!G.toldChug) { G.toldChug = true; ev(G, 'chug'); }

    } else if (!e.flyer) for (const pd of G.puddles) {

        e.tipsy = Math.max(e.tipsy, pd.tipsy * (e.boss ? .5 : 1)); if (pd.vuln) e.vuln = Math.max(e.vuln || 0, pd.vuln);

    }

    if (e.stun > 0) e.stun -= dt;

      G.pile -= n; G.stats.itemsLost += n; G.stats.waveLost[G.wave - 1] = (G.stats.waveLost[G.wave - 1] || 0) + n;
      e.dead = true; G.enemies.splice(G.enemies.indexOf(e), 1);

      ev(G, 'stolen', { name: e.name, n, carry: e.carry });
      checkLose(G);

  }

  G.towers.forEach((t, i) => {

    if (t.type === 'sizzle') {

        if (t.qcd <= 0) {

<script>
// ===== Hold My Loot v2: UI, input, saving =====
(function () {

  // ---------- saving ----------

      totals: Object.assign(d.totals, m.totals || {}), settings: Object.assign(d.settings, { sound: true, volume: .6 }, m.settings || {}),
      shed: m.shed || {}, rocks: m.rocks || 0, jobs: m.jobs || [], jobsDone: m.jobsDone || 0,

  // ---------- HUD ----------

    const shareText = 'Hold My Loot, ' + (G.mode === 'daily' ? 'Daily Nap ' + G.daily.key : G.mode === 'endless' ? 'The Long Nap' : G.map.name) + ': ' + (G.mode === 'endless' ? 'survived ' + (G.wave - 1) + ' waves' : G.won ? 'Gary kept ' + G.pile + '/' + G.pileMax : 'cleaned out on wave ' + G.wave) + '\n' + r.grid + (r.best ? '\nBest drop: ' + RARITY[r.best.tier].k + ' ' + r.best.name : '');
    openModal(
      '<h2 class="title sm">' + title + '</h2>' + (G.won && !endless ? starsHTML(r.stars) : '') + '<p class="lede">' + sub + '</p>' + unlockLine + rocksLine + shedHint +
      '<p class="afk">Gary was AFK for ' + afk + '. ' + G.stats.kills + ' monsters died. Nan crit ' + G.stats.crits + ' times. ' + G.stats.heists + (G.stats.heists === 1 ? ' monster wore' : ' monsters wore') + ' his stuff.</p>' +
      '<div class="grid" aria-label="Items lost per wave">' + r.grid + '</div>' +
      '<h3>The haul</h3>' + (haul ? '<ul class="haul">' + haul + '</ul>' + (restN ? '<p class="small">Plus ' + restN + ' lesser bits and bobs.</p>' : '') : '<p class="small">Nothing banked this time.</p>') +
      '<p class="small">Gary\u2019s Stash: ' + r.stashFound + ' of ' + STASH_TOTAL + ' found.</p>' +
      '<h3>Skills</h3>' + skills + (nextLine ? '<p class="next">' + nextLine + '</p>' : '') + jobsLine +
      '<div class="row3">' + (G.won && nextMap && G.mode === 'campaign' ? '<button class="btn primary big" id="nextBtn">Next level</button>' : '') +
      '<button class="btn ' + (G.won && nextMap && G.mode === 'campaign' ? '' : 'primary ') + 'big" id="againBtn">' + (G.won || endless ? 'Play again' : 'Try again') + '</button><button class="btn big" id="levelsBtn">Home</button><button class="btn big" id="shareBtn">Share</button></div><p class="small" id="shareMsg" aria-live="polite"></p>', '', 1000);
    const mi = G.mapIdx, mode = G.mode;
    if ($('nextBtn')) $('nextBtn').onclick = ev => { if (deliberate(ev, $('nextBtn'))) startLevel(mi + 1); };
    $('againBtn').onclick = ev => { if (deliberate(ev, $('againBtn'))) mode === 'daily' ? startDaily() : mode === 'endless' ? startLong(mi) : startLevel(mi); };
    $('levelsBtn').onclick = ev => { if (deliberate(ev, $('levelsBtn'))) showHome(); };
    $('shareBtn').onclick = async ev => {
      if (!deliberate(ev, $('shareBtn'))) return;
      const msg = $('shareMsg');
      try { if (navigator.share) { await navigator.share({ text: shareText }); msg.textContent = 'Shared.'; return; } } catch (e) { if (e && e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(shareText); msg.textContent = 'Copied. Paste it in the group chat.'; }
      catch (e) { msg.innerHTML = 'Copy this:<br><textarea readonly rows="4"></textarea>'; const ta = msg.querySelector('textarea'); ta.value = shareText; ta.focus(); ta.select(); }
    };
  }

  // ---------- menu ----------
  const TABS = [['skills', 'Skills'], ['stash', 'Stash'], ['stats', 'Stats'], ['settings', 'Settings']];
  function openMenu(tab) { menuOpen = true; menuTab = tab || menuTab; closeSheet(); renderMenu(); }
  function closeMenu() {
    menuOpen = false;
    if (state === 'home') showHome();
    else closeModal();
    lastHud = '';
  }
  function fmtTime(s) { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + 'h ' + m + 'm' : m + 'm'; }
  function menuBody() {
    if (menuTab === 'skills') {
      const total = SKILLS.reduce((a, s) => a + levelInfo(meta.xp[s] || 0).L, 0);
      return '<p class="small">Total skill level ' + total + ' of ' + SKILLS.length * MAX_LEVEL + '. Skills level up from every run, win or lose.</p>' + SKILLS.map(s => {
        const li = levelInfo(meta.xp[s] || 0);
        const run = G && (state === 'play' || state === 'draft') && G.xp[s] ? ' <em class="runxp">+' + Math.round(G.xp[s]) + ' this run</em>' : '';
        return '<div class="skill"><div class="sk-top"><b>' + SKILL_NAMES[s] + ' ' + li.L + run + '</b><span>' + (li.max ? 'Max level' : li.into + ' / ' + li.need + ' XP') + '</span></div><div class="bar"><i style="width:' + (li.max ? 100 : Math.round(100 * li.into / li.need)) + '%"></i></div><p class="sdesc">' + SKILL_DESC[s] + '</p></div>';
      }).join('');
    }
    if (menuTab === 'stash') {
      const found = Object.keys(meta.stash).length;
      return '<p class="small">Gary\u2019s Stash: ' + found + ' of ' + STASH_TOTAL + ' found. Loot from a run joins the stash when the run ends.</p>' +
        '<div class="sdetail" id="stDetail" aria-live="polite">Tap an item to look at it.</div><div class="sgrid">' + ALL_ITEMS.map((it, i) => {
          const n = meta.stash[it.name] || 0, c = RARITY[it.tier].c;
          return '<button class="stile' + (n ? '' : ' unk') + '" style="--rc:' + c + '" data-si="' + i + '" aria-label="' + (n ? it.name : 'Not found yet') + '">' + (n ? '<span>' + it.icon + '</span>' + (n > 1 ? '<i>' + n + '</i>' : '') : '<span>?</span>') + '</button>';
        }).join('') + '</div>';
    }
    if (menuTab === 'stats') {
      const T = meta.totals;
      const rows = [['Shiny Rocks earned', T.rocksEarned || 0], ['Odd jobs done', meta.jobsDone || 0], ['Daily Naps won', meta.daily.count || 0], ['Best Long Nap', Math.max(0, ...Object.values(meta.endlessBest || {})) ? 'Wave ' + Math.max(...Object.values(meta.endlessBest)) : 'Not yet'], ['Best combo', T.bestCombo || 0], ['Monsters made tipsy', T.tipsy || 0], ['Runs', meta.runs], ['Wins', meta.wins], ['Time with Gary', fmtTime(T.time || 0)], ['Monsters stopped', T.kills], ['Nan crits', T.crits], ['Monsters that wore his stuff', T.heists], ['Loot snatched back', T.snatches], ['Loot banked', T.banked], ['Gary poked', T.pokes]];
      const bosses = MAPS.map(m => '<li><span>' + ENEMIES[m.boss].name.split(',')[0] + '</span><b>' + ((T.bosses || {})[m.boss] || 0) + '</b></li>').join('');
      const lv = MAPS.map((m, i) => { const ms = meta.maps[m.id]; return '<li><span>' + (i + 1) + '. ' + m.name + '</span>' + (ms ? starsHTML(ms.stars) + '<b>' + ms.wins + '/' + ms.plays + '</b>' : '<b>' + (mapUnlocked(meta, i) ? 'Not played' : 'Locked') + '</b>') + '</li>'; }).join('');
      return '<ul class="statlist">' + rows.map(r => '<li><span>' + r[0] + '</span><b>' + r[1] + '</b></li>').join('') + '</ul><h3>Bosses beaten</h3><ul class="statlist">' + bosses + '</ul><h3>Levels (wins / plays)</h3><ul class="statlist">' + lv + '</ul>';
    }
    // settings
    const ls = lastSaved ? lastSaved.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'not yet this session';
    return '<label class="tog"><input type="checkbox" id="setInstant"' + (meta.settings.instantLoot ? ' checked' : '') + '><span><b>Instant loot</b><small>Loot goes straight to Gary. Monsters can\u2019t steal it. Less chaos, fewer laughs.</small></span></label>' +
      '<label class="tog"><input type="checkbox" id="setSound"' + (meta.settings.sound !== false ? ' checked' : '') + '><span><b>Sound effects</b><small>Bonks, smashes, squawks and a little fanfare when you level up.</small></span></label>' +
      '<label class="slider"><span>Volume</span><input type="range" id="setVol" min="0" max="1" step="0.05" value="' + (meta.settings.volume == null ? .6 : meta.settings.volume) + '"></label>' +
      '<label class="tog"><input type="checkbox" id="setShake"' + (meta.settings.shake ? ' checked' : '') + '><span><b>Screen shake</b><small>On crits, Gary\u2019s sword and stolen loot.</small></span></label>' +
      '<h3>Saving</h3><p class="small">' + (storageOk ? 'Progress saves on this device after every build, every wave and every run. Last saved: ' + ls + '.' : 'This browser is blocking storage, so progress won\u2019t survive a reload here. Use a save code to keep it.') + '</p>' +
      '<div class="row2b"><button class="btn" id="saveNow">Save now</button><button class="btn" id="copyCode">Copy save code</button></div>' +
      '<p class="small">A save code backs up your progress or moves it to another device.</p>' +
      '<textarea id="codeBox" rows="3" placeholder="Paste a save code here"></textarea><button class="btn" id="loadCode">Load save code</button><p class="small" id="codeMsg" aria-live="polite"></p>' +
      '<h3>Start over</h3><button class="btn danger" id="resetBtn">Reset all progress</button>';
  }
  function renderMenu() {
    const inRun = G && (state === 'play' || state === 'draft');
    openModal('<div class="menu-head"><h2 class="title sm">Menu</h2><button class="btn" id="menuClose" data-focus>' + (inRun ? 'Back to game' : 'Close') + '</button></div>' +
      '<div class="tabs" role="tablist">' + TABS.map(t => '<button role="tab" class="tab' + (t[0] === menuTab ? ' on' : '') + '" aria-selected="' + (t[0] === menuTab) + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>' +
      '<div class="tabbody">' + menuBody() + '</div>' +
      (inRun ? '<div class="menu-foot"><button class="btn" id="quitBtn">Save and quit to levels</button><p class="small">Your run resumes from the start of the current wave.</p></div>' : ''), 'menu');
    $('menuClose').onclick = closeMenu;
    $('modalCard').querySelectorAll('.tab').forEach(b => b.onclick = () => { menuTab = b.dataset.tab; renderMenu(); });
    if ($('quitBtn')) $('quitBtn').onclick = () => { if (G && !G.waveActive) saveRun(); saveMeta(); menuOpen = false; showHome(); };
    if (menuTab === 'stash') {
      $('modalCard').querySelectorAll('.stile').forEach(b => b.onclick = () => {
        const it = ALL_ITEMS[+b.dataset.si], n = meta.stash[it.name] || 0, c = RARITY[it.tier].c;
        $('stDetail').innerHTML = n ? '<b>' + it.icon + ' ' + it.name + '</b> <span style="color:' + c + '">' + RARITY[it.tier].k + '</span>' + (n > 1 ? ' \u00d7' + n : '') + '<br>' + (ITEM_DESC[it.name] || '')
          : '<b>Not found yet</b> <span style="color:' + c + '">' + RARITY[it.tier].k + '</span><br>' + (it.boss ? 'Dropped by ' + ENEMIES[it.boss].name.split(',')[0] + '.' : 'Keep scrounging.');
      });
    }
    if (menuTab === 'settings') {
      $('setInstant').onchange = e => { meta.settings.instantLoot = e.target.checked; if (G) G.instantLoot = e.target.checked; saveMeta(); };
      $('setShake').onchange = e => { meta.settings.shake = e.target.checked; saveMeta(); };
      $('setSound').onchange = e => { meta.settings.sound = e.target.checked; applySound(); saveMeta(); if (e.target.checked) SFX.play('pick'); };
      $('setVol').oninput = e => { meta.settings.volume = +e.target.value; applySound(); };
      $('setVol').onchange = () => { saveMeta(); SFX.play('coin'); };
      $('saveNow').onclick = () => { const ok = saveMeta(); saveRun(); $('codeMsg').textContent = ok ? 'Saved.' : 'Couldn\u2019t save here. Copy a save code instead.'; };
      $('copyCode').onclick = async () => {
        const code = 'HML3:' + btoa(unescape(encodeURIComponent(JSON.stringify(meta))));
        try { await navigator.clipboard.writeText(code); $('codeMsg').textContent = 'Save code copied. Keep it somewhere safe.'; }
        catch (e) { $('codeBox').value = code; $('codeBox').select(); $('codeMsg').textContent = 'Copy the code from the box above.'; }
      };
      $('loadCode').onclick = () => {
        const v = $('codeBox').value.trim();
        try {
          if (!/^HML[23]:/.test(v)) throw 0;
          const m = JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));
          if (!m || !m.xp) throw 0;
          meta = mergeMeta(m); saveMeta(); $('codeMsg').textContent = 'Save code loaded.';
          if (G) G.meta = meta;
        } catch (e) { $('codeMsg').textContent = 'That doesn\u2019t look like a Hold My Loot save code.'; }
      };
      let armed = false;
      $('resetBtn').onclick = () => {
        if (!armed) { armed = true; $('resetBtn').textContent = 'Tap again to erase everything'; return; }
        meta = defaultMeta(); ensureJobs(meta); saveMeta(); clearRun(); menuOpen = false; showHome();
      };
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const running = G && state === 'play' && !paused && !menuOpen;
    if (running && now < stopUntil) { R.frame(ctx, G, { W, H, scale, dpr, paused: true, speed, selPad, settings: meta.settings, mapIdx: homeMap }); hud(); requestAnimationFrame(frame); return; }
    if (running) {
      let rem = dt * speed;
      while (rem > 0) { const s = Math.min(1 / 60, rem); update(G, s); rem -= s; }
      handleEvents();
    }
    R.frame(ctx, G, { W, H, scale, dpr, paused: !running, speed, selPad, settings: meta.settings, mapIdx: homeMap });
    const hs = R.takeHitstop(); if (hs > 0 && running) stopUntil = now + hs * 1000;
    hud();
    requestAnimationFrame(frame);
  }
  let stopUntil = 0;
  function applySound() { SFX.setMuted(meta.settings.sound === false); SFX.setVolume(meta.settings.volume == null ? .6 : meta.settings.volume); }
  const unlockAudio = () => { SFX.unlock(); applySound(); };
  document.addEventListener('pointerdown', unlockAudio, true);
  document.addEventListener('keydown', unlockAudio, true);
  document.addEventListener('click', ev => { const b = ev.target.closest && ev.target.closest('button'); if (b && !b.disabled && !b.classList.contains('dcard')) SFX.play('click'); }, true);
  window.__hml = () => G;
  resize();
  if (document.fonts) document.fonts.ready.then(() => R.invalidate());
  showHome();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
