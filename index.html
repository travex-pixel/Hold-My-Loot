.rhero h2 { font-family: Fraunces, Georgia, serif; font-size: 34px; margin: 4px 0 2px; letter-spacing: .5px; }
.rhero.win h2 { color: #3E5E3A; } .rhero.lose h2 { color: #B5403A; }
.ribbon { display: inline-block; background: linear-gradient(90deg, #FF8A8A, #FFC46B, #FFE97A, #8EE08A, #7CC8FF, #B59BFF); color: #3B2F2A; font-weight: 900; font-size: 13px; letter-spacing: 1.5px; padding: 4px 14px; border-radius: 12px; animation: bpulse 1.4s ease-in-out infinite; }
.rstars { display: flex; justify-content: center; gap: 8px; margin: 2px 0; }
.rstar { width: 46px; height: 46px; background: #E8DCC2; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); transform: scale(0); animation: starin .45s cubic-bezier(.2,1.8,.4,1) forwards; }
.rstar.on { background: linear-gradient(160deg, #FFF1A8, #FFC94A 55%, #E3A02C); }
.rstar:nth-child(2) { width: 56px; height: 56px; margin-top: -6px; }
@keyframes starin { to { transform: scale(1); } }
.rsub { font-weight: 800; color: var(--muted); font-size: 14.5px; margin: 2px 0 6px; } .rsub q { font-style: italic; }
.rbig { font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 700; margin: 0; }
.rquip { font-weight: 900; font-size: 17px; margin: 6px 0 2px; } .rhint { font-weight: 800; font-size: 14px; color: #5A4E9A; background: #F1EDFF; border-radius: 12px; padding: 7px 10px; margin: 8px 0 4px; }
.rrow { display: flex; flex-direction: column; gap: 8px; align-items: center; margin: 6px 0 4px; }
.rloot { display: flex; gap: 6px; justify-content: center; } .lchip { position: relative; width: 44px; height: 44px; border-radius: 12px; background: #FFFDF6; border: 2.5px solid var(--rc, #ccc); font-size: 24px; line-height: 39px; animation: starin .4s cubic-bezier(.2,1.8,.4,1) both; animation-delay: 1s; transform: scale(0); }
.lchip i { position: absolute; right: -5px; bottom: -5px; background: #3B2F2A; color: #fff; font-style: normal; font-size: 10.5px; font-weight: 900; border-radius: 8px; padding: 0 4px; line-height: 16px; } .lchip.more { font-size: 14px; font-weight: 900; border-style: dashed; }
.lchip:nth-child(2) { animation-delay: 1.1s; } .lchip:nth-child(3) { animation-delay: 1.2s; } .lchip:nth-child(4) { animation-delay: 1.3s; } .lchip:nth-child(5) { animation-delay: 1.4s; }
.rchips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.rchip { display: inline-flex; align-items: center; gap: 4px; background: var(--paper2); border-radius: 12px; padding: 5px 10px; font-weight: 900; font-size: 15px; }
.rchip.xp { background: #EEE8FF; color: #5A4E9A; } .rchip .rockic { width: 14px; height: 14px; display: inline-block; }
.ucard { display: flex; align-items: center; gap: 10px; text-align: left; background: linear-gradient(135deg, #FFF6D6, #FDE3EC); border: 2px solid #EAC66A; border-radius: 16px; padding: 6px 10px; margin: 8px 0 0; animation: cpop .5s cubic-bezier(.2,1.8,.4,1) both; animation-delay: 1.2s; }
.ucard canvas.pt { width: 64px; height: 56px; flex: 0 0 64px; } .ucard b { display: block; font-size: 14.5px; } .ucard span { font-size: 12.5px; font-weight: 800; color: var(--muted); }
.ucard .unum { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 12px; background: #FFE07A; display: flex; align-items: center; justify-content: center; font: 700 22px Fraunces, Georgia, serif; }
.ucard.gary { background: linear-gradient(135deg, #EEE8FF, #E2F1FF); border-color: #CFC6F2; }
.rjob { font-size: 13.5px; font-weight: 800; margin: 8px 0 0; }
.btn.rgo { width: 100%; margin-top: 12px; font-size: 20px; min-height: 58px; letter-spacing: .5px; }
.rsec { display: flex; gap: 6px; margin-top: 8px; } .rsec .btn { flex: 1; min-height: 42px; font-size: 14px; }
.rdetails { margin-top: 10px; text-align: left; } .rdetails summary { cursor: pointer; font-weight: 900; color: var(--muted); text-align: center; padding: 8px; list-style: none; } .rdetails summary::after { content: ' \25BE'; } .rdetails[open] summary::after { content: ' \25B4'; }
@media (max-height: 700px) { .ccard canvas.pt { height: 60px; } .cgrid { gap: 6px; } .rstar { width: 38px; height: 38px; } .rstar:nth-child(2) { width: 46px; height: 46px; } .rhero h2 { font-size: 28px; } .wcrew canvas.pt { width: 88px; height: 80px; } }
.playnext { width: 100%; display: flex; flex-direction: column; gap: 0; margin: 12px 0 0; min-height: 62px; font-size: 20px; letter-spacing: .5px; }
.playnext small { font-size: 12.5px; font-weight: 800; color: #5A4632; letter-spacing: 0; }
.rtease { font-size: 13px; font-weight: 800; color: var(--muted); margin: 8px 0 0; } .rtease b { color: var(--ink); }

/* ===== goals / up next ===== */
.goals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.goal { background: var(--paper2); border-radius: 14px; padding: 7px 6px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; min-height: 92px; }
.goal canvas.pt, .goal .gico { width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.goal .gico.rockic { width: 22px; height: 26px; margin: 7px 0; }
.goal b { font-size: 12.5px; line-height: 1.1; display: block; } .goal span { font-size: 11px; font-weight: 800; color: var(--muted); line-height: 1.15; display: block; }
.goal.ready { background: #FFF1C8; border: 1.5px solid #E3A02C; }
canvas.pt.sil { filter: brightness(0) opacity(.3); }
/* ===== daily ===== */
.mode.daily { background: linear-gradient(135deg, #E2F1FF, #EEE8FF); border-color: #CFC6F2; }
.mode.daily .dmap { font-size: 14.5px; font-weight: 900; color: var(--ink); }
.dchips { display: flex; gap: 4px; flex-wrap: wrap; margin: 3px 0; } .dchips i { font-style: normal; font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 9px; background: #E2EFD6; color: #3E5E3A; } .dchips i.bad { background: #FBE1DA; color: #B5403A; }
/* ===== synergy hints ===== */
.synrow { display: flex; gap: 5px; flex-wrap: wrap; margin: -4px 0 8px; min-height: 22px; }
.synchip { font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 10px; background: var(--paper2); color: var(--muted); } .synchip.known { background: #E2F7EF; color: #1E9E7A; }
.syn-none { font-size: 11px; font-weight: 800; color: var(--muted); padding: 3px 2px; }
/* ===== reveal ===== */
.reveal { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
.rtag { background: linear-gradient(90deg, #FF8A8A, #FFC46B, #FFE97A, #8EE08A, #7CC8FF, #B59BFF); color: #3B2F2A; font-weight: 900; font-size: 12.5px; letter-spacing: 2px; padding: 4px 14px; border-radius: 12px; }
.reveal canvas.pt.huge { width: 240px; height: 210px; animation: cpop .6s cubic-bezier(.2,1.8,.4,1); }
.reveal .title { margin: 0; } .crole.big { font-size: 14px; }
.rq { font-size: 17px; font-weight: 800; font-style: italic; margin: 6px 0 10px; }
.reveal .btn.big { width: 100%; font-size: 20px; min-height: 58px; }
/* ===== level teases / mastery ===== */
.level { position: relative; }
.level em.tease, .level em.mods { position: absolute; top: -7px; right: 10px; font-style: normal; font-size: 10px; font-weight: 900; letter-spacing: .3px; padding: 2px 8px; border-radius: 9px; background: #FFE07A; color: #5A4632; box-shadow: 0 1px 0 #C98A1E; }
.level em.mods { background: #E2F1FF; color: #2F5E8A; box-shadow: none; }
.level.next { border-color: #E3A02C; box-shadow: 0 3px 0 #C98A1E; }
.lvnew { font-weight: 900; color: #5A4632; background: #FFF1C8; border-radius: 12px; padding: 6px 10px; margin: 6px 0; font-size: 14px; }
.ucard.tease { background: var(--paper2); border-style: dashed; border-color: #D9C9A6; animation: none; margin-top: 8px; }
.ucard.tease canvas.pt { filter: brightness(0) opacity(.3); }
.mastery { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; } .mastery span { font-size: 13px; font-weight: 800; color: var(--muted); background: var(--paper2); border-radius: 10px; padding: 6px 9px; } .mastery span.done { color: #3E5E3A; background: #E2EFD6; }
/* ===== pyjamas ===== */
.tabs.three { grid-template-columns: 1fr 1fr 1fr; }
.pjgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pj { background: var(--paper2); border: 2.5px solid transparent; border-radius: 16px; padding: 10px; font-family: inherit; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.pj.on { border-color: #6FA05A; background: #EEF7E6; } .pj.locked { opacity: .55; }
.pj .sw { position: relative; width: 86px; height: 34px; border-radius: 17px; border: 2px solid; overflow: hidden; } .pj .sw .st { position: absolute; inset: 0; } .pj .sw .belt { position: absolute; left: 30px; top: 0; width: 6px; height: 100%; } .pj .sw .stars { position: absolute; right: 8px; top: 7px; color: rgba(255,255,255,.8); font-style: normal; font-size: 12px; }
.pj b { font-size: 14px; } .pj small { font-size: 11.5px; font-weight: 800; color: var(--muted); }
.supbadge { color: #D9484F; font-size: 26px; vertical-align: 6px; }
.codein { flex: 1; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; font: 700 15px Nunito, sans-serif; background: #fff; }
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.h2.tight { margin-top: 10px; }
.btn.glow { box-shadow: 0 3px 0 #C98A1E, 0 0 14px rgba(255,200,80,.7); border-color: #E3A02C; }
.btn .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #E0453A; margin-left: 4px; vertical-align: 2px; }
.supcard { background: linear-gradient(135deg, #FFF1F0, #FFF6E2); border: 1.5px solid #F2B8B5; border-radius: 16px; padding: 10px 12px; margin: 10px 0 0; display: flex; flex-direction: column; gap: 8px; }
.supcard b { font-size: 15px; display: block; } .supcard span { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.35; }
.bcard.far { opacity: .5; } .bcard.far .ckeys { color: #B5403A; }

/* ===== picture-first crew cards (v22) ===== */
.ccard { background: linear-gradient(170deg, var(--c1, #FBF4E4) 0%, var(--c2, #F1E4C6) 100%); border: 2.5px solid rgba(255,255,255,.7); box-shadow: 0 3px 0 var(--c3, #C9B48E), inset 0 0 0 1px rgba(0,0,0,.04); padding: 0 0 6px; overflow: hidden; gap: 2px; }
.cstage { position: relative; width: 100%; height: 86px; display: flex; align-items: flex-end; justify-content: center; background: radial-gradient(ellipse 60% 55% at 50% 58%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.55) 45%, rgba(255,255,255,0) 72%), repeating-linear-gradient(135deg, rgba(255,255,255,.12) 0 8px, rgba(255,255,255,0) 8px 16px); }
.cstage::after { content: ''; position: absolute; left: 22%; right: 22%; bottom: 6px; height: 8px; border-radius: 50%; background: rgba(40,30,20,.12); }
.ccard .cstage canvas.pt { width: 100%; height: 86px; position: relative; z-index: 1; }
.ccard .cname { display: inline-block; margin-top: -9px; position: relative; z-index: 2; background: #3B2F2A; color: #FFF6E2; font-size: 12px; font-weight: 900; padding: 2px 7px; border-radius: 10px; box-shadow: 0 2px 0 rgba(0,0,0,.18); max-width: 94%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ccard .crole { color: var(--c3, #6C5CE0); font-size: 11.5px; }
.kchips { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; padding: 0 3px; }
.kchip { font-style: normal; font-size: 9.5px; font-weight: 900; letter-spacing: .2px; background: rgba(255,255,255,.75); color: #3B2F2A; border-radius: 8px; padding: 2px 5px 2px 3px; white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
.kchip s { text-decoration: none; font-size: 11px; }
.kchip.sm { font-size: 8.5px; padding: 1px 4px 1px 2px; } .kchip.sm s { font-size: 10px; }
.ccard.sel { border-color: #5FA05A; box-shadow: 0 3px 0 #4E8C47, 0 0 0 3px rgba(111,160,90,.35); background: linear-gradient(170deg, var(--c1, #FBF4E4) 0%, var(--c2, #F1E4C6) 100%); }
.ccard.locked { background: linear-gradient(170deg, #4A4458, #2E2A38); box-shadow: 0 3px 0 #1E1B26; border-color: rgba(255,255,255,.12); }
.ccard.locked .cstage { background: radial-gradient(ellipse 55% 50% at 50% 58%, rgba(255,255,255,.18), rgba(255,255,255,0) 70%); }
.ccard.locked .cname { background: rgba(255,255,255,.12); color: #CFC6F2; }
.ccard.locked .crole { color: #CFC6F2; }
.ccard.locked canvas.pt { filter: brightness(0) invert(.25); }
.cinfo { z-index: 3; }
.ctick { z-index: 3; }
.cinfo-wrap .cstage.big { height: 170px; border-radius: 20px; background-color: var(--c2); } .cinfo-wrap .cstage.big canvas.pt { height: 160px; width: 190px; }
.cinfo-wrap .kchips { margin: 4px 0; } .cinfo-wrap .kchip { font-size: 12px; padding: 3px 8px 3px 5px; } .cinfo-wrap .kchip s { font-size: 14px; }
.reveal .kchips { margin: 2px 0 4px; } .reveal .kchip { font-size: 12.5px; padding: 3px 9px 3px 6px; background: var(--paper2); } .reveal .kchip s { font-size: 15px; }
/* build menu */
.bcard { background: linear-gradient(170deg, var(--c1, #FBF4E4), var(--c2, #F1E4C6)); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 3px 0 var(--c3, #C9B48E); padding: 0 0 5px; overflow: hidden; gap: 2px; }
.bcard .cstage { height: 64px; } .bcard .cstage canvas.pt { width: 100%; height: 64px; position: relative; z-index: 1; }
.bcard .cname { display: inline-block; margin-top: -8px; position: relative; z-index: 2; background: #3B2F2A; color: #FFF6E2; font-size: 12px; font-weight: 900; padding: 1px 8px; border-radius: 9px; }
.bcard .cost { z-index: 3; }
/* draft cards */
.dcard { display: grid !important; grid-template-columns: 54px 1fr; gap: 10px; align-items: center; text-align: left; }
.dcard .dicon { width: 54px; height: 54px; border-radius: 14px; background: linear-gradient(170deg, var(--c1, #FFF1C8), var(--c2, #F2D98A)); display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; box-shadow: inset 0 -3px 0 rgba(0,0,0,.08); }
.dcard .dicon canvas.pt { width: 64px; height: 58px; }
.dcard.cursed .dicon { background: linear-gradient(170deg, #4A4458, #2E2A38); }
.dcard .dtext { display: flex; flex-direction: column; gap: 2px; }
.drafts.first .dcard { animation: bpulse 1.6s ease-in-out infinite; } .drafts.first .dcard:nth-child(2) { animation-delay: .2s; } .drafts.first .dcard:nth-child(3) { animation-delay: .4s; }
.dcard.queued, .btn.queued { outline: 3px solid #5FA05A; outline-offset: 2px; }
@media (max-height: 700px) { .cstage, .ccard .cstage canvas.pt { height: 70px; } }

/* ===== v23: home screen card, feedback, brag ===== */
.a2hs { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #E2F1FF, #EEE8FF); border: 1.5px solid #CFC6F2; border-radius: 16px; padding: 9px 10px; margin: 10px 0 0; text-align: left; }
.a2hs .a2ico { font-size: 28px; } .a2hs b { display: block; font-size: 14.5px; } .a2hs span { font-size: 12.5px; font-weight: 700; color: var(--muted); } .a2hs > div { flex: 1; }
.a2hs .btn { min-height: 40px; padding: 7px 12px; font-size: 14px; white-space: nowrap; }
.a2steps { text-align: left; font-size: 16px; font-weight: 800; line-height: 1.5; background: var(--paper2); border-radius: 16px; padding: 12px 14px 12px 34px; margin: 8px 0 12px; }
.a2steps li { margin-bottom: 6px; } .ios-share { display: inline-block; border: 2px solid #2F86D8; border-radius: 6px; padding: 0 5px; color: #2F86D8; font-size: 13px; }
.moodrow { background: var(--paper2); border-radius: 16px; padding: 10px 12px; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.moodrow > span { font-weight: 900; font-size: 14px; } .moodrow > div { display: flex; justify-content: center; gap: 10px; }
.mood { font-size: 30px; width: 54px; height: 54px; border-radius: 16px; border: 2px solid var(--line); background: #FFFDF6; cursor: pointer; transition: transform .1s; } .mood:active { transform: scale(.9); }
.fbwrap { display: flex; gap: 6px; } .fbwrap textarea { flex: 1; border: 2px solid var(--line); border-radius: 12px; padding: 8px; font: 700 14px Nunito, sans-serif; resize: none; } .fbwrap .btn { min-height: 44px; }
.moodrow small { font-size: 11px; color: var(--muted); font-weight: 700; }
.brag { display: block; width: 100%; margin: 8px 0 0; background: none; border: 0; font: 900 15px Nunito, sans-serif; color: #2F86D8; padding: 8px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ===== v25: gift, tomorrow, leaderboard ===== */
.gift { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: linear-gradient(135deg, #FFF1C8, #FDE3EC); border: 2px solid #EAC66A; border-radius: 16px; padding: 10px 12px; margin: 10px 0 0; font-family: inherit; color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 #D9B04A; animation: bpulse 1.8s ease-in-out infinite; }
.gift .gbox { font-size: 34px; animation: wiggle 1.2s ease-in-out infinite; } .gift b { display: block; font-size: 15.5px; } .gift small { font-size: 12.5px; font-weight: 800; color: var(--muted); }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
.giftopen { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; } .giftopen .gbig { font-size: 64px; animation: cpop .6s cubic-bezier(.2,1.8,.4,1); } .giftopen .btn.big { width: 100%; }
.tomorrow { background: linear-gradient(135deg, #E2F1FF, #EEE8FF); border-radius: 14px; padding: 8px 11px; margin: 12px 0 0; font-size: 13px; font-weight: 700; } .tomorrow b:first-child { display: block; font-size: 14px; }
.mybest { background: var(--paper2); border-radius: 12px; padding: 8px 11px; font-weight: 800; margin: 6px 0; }
.board { list-style: none; padding: 0; margin: 6px 0; } .board li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 12px; background: var(--paper2); margin-bottom: 4px; font-size: 14.5px; }
.board li.me { background: #E2EFD6; border: 1.5px solid #6FA05A; } .board .bpos { font-weight: 900; text-align: center; } .board .bw { font-weight: 900; color: var(--muted); font-size: 13px; }
.nickrow { background: #FFF1C8; border-radius: 14px; padding: 9px 10px; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; } .nickrow > span { font-weight: 900; font-size: 13.5px; } .nickrow > div { display: flex; gap: 6px; } .nickrow .btn { min-height: 42px; }
#coach.ring::before { content: '\1F446'; position: absolute; left: 50%; bottom: -62px; font-size: 34px; transform: translateX(-30%); animation: handtap 1s ease-in-out infinite; filter: drop-shadow(0 3px 2px rgba(0,0,0,.25)); }
@keyframes handtap { 0%,100% { transform: translate(-30%, 0) scale(1); } 45% { transform: translate(-30%, -8px) scale(1.05); } 60% { transform: translate(-30%, 2px) scale(.92); } }

/* ===== v26: wardrobe ===== */
.wallet { display: flex; align-items: center; gap: 10px; background: var(--paper2); border-radius: 14px; padding: 7px 10px; margin: 4px 0 8px; font-weight: 900; font-size: 16px; }
.wallet span { display: inline-flex; align-items: center; gap: 4px; } .wallet small { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 800; text-align: right; }
.wallet .rockic, .wcard .rockic, .wallet .shardic, .wcard .shardic { width: 14px; height: 14px; display: inline-block; }
.wwho { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; } .wwho::-webkit-scrollbar { display: none; }
.wp { flex: 0 0 56px; border: 2px solid var(--line); background: var(--paper2); border-radius: 14px; padding: 2px 0 3px; display: flex; flex-direction: column; align-items: center; font-family: inherit; color: var(--ink); cursor: pointer; }
.wp.on { border-color: #6FA05A; background: #EEF7E6; } .wp canvas.pt { width: 50px; height: 42px; } .wp .gz { font-size: 26px; height: 42px; line-height: 42px; } .wp small { font-size: 10.5px; font-weight: 900; }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wcard { position: relative; border-radius: 16px; border: 2.5px solid var(--line); background: var(--paper2); padding: 16px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: inherit; color: var(--ink); cursor: pointer; overflow: hidden; touch-action: manipulation; }
.wcard:active { transform: scale(.96); }
.wcard canvas.wprev { width: 100%; height: 76px; }

function shedLevel(meta, id) { return (meta.shed && meta.shed[id]) || 0; }
function buyShed(meta, id) {
  const S = SHED.find(s => s.id === id), L = shedLevel(meta, id);
  if (!S || L >= S.costs.length || meta.rocks < S.costs[L]) return false;
  meta.rocks -= S.costs[L]; meta.shed[id] = L + 1; return true;
}

const JOB_REWARD = [15, 30, 50];
function newJob(meta) {
  const active = (meta.jobs || []).map(j => j.id);
  const tier = meta.jobsDone < 5 ? 0 : meta.jobsDone < 15 ? 1 : 2;
  const pool = JOBS.filter(j => !active.includes(j.id) && (!j.req || j.req(meta)) && j.id !== meta.lastJob);
  const J = pool[Math.floor(Math.random() * pool.length)];
  return { id: J.id, n: J.n[tier], p: 0, reward: JOB_REWARD[tier] };
}
function ensureJobs(meta) {
  meta.jobs = (meta.jobs || []).filter(j => JOBS.some(J => J.id === j.id));
  while (meta.jobs.length < 3) meta.jobs.push(newJob(meta));

    if (arm) {

      // A fresh tap during the short arming window is remembered and applied when it ends.
      const btns = [...card.querySelectorAll('button')].filter(b => !b.disabled);
      let queued = null;
      btns.forEach(b => {
        b.addEventListener('pointerdown', () => { b.dataset.down = '1'; });
